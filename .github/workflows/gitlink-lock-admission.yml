name: gitlink-lock admission (source provenance)

on:
  pull_request:
    paths:
      - .gitmodules
      - .zpkg.toml
      - .zpkg.lock
      - apps/**
      - scripts/verify_gitlink_lock.py
      - scripts/test_verify_gitlink_lock.py
      - .github/workflows/gitlink-lock-admission.yml

permissions:
  contents: read

# Unit tests import a local helper; suppress __pycache__ mutation of the worktree.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lock-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR head without credentials or submodule code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head, tree and clean source
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          echo "EXACT_TREE=$(git rev-parse HEAD^{tree})"
      - name: Run positive and adversarial gitlink-lock test matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s scripts -p 'test_verify_gitlink_lock.py' -v
      - name: Verify tracked Gitlink and Zed metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_gitlink_lock.py
          test -z "$(git status --porcelain)"
