name: Monorepo gitlink provenance and source admission

on:
  pull_request:
    paths:
      - .gitmodules
      - .zpkg.toml
      - .zpkg.lock
      - apps/**
      - scripts/verify_gitlinks.py
      - tests/test_verify_gitlinks.py
      - .github/workflows/gitlink-provenance.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-gitlinks:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    timeout-minutes: 15
    steps:
      - name: Checkout immutable monorepo head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head and clean source tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$EXPECTED_HEAD"
          echo "EXACT_TREE=$(git rev-parse HEAD^{tree})"
      - name: Run all Git index and manifest negative contracts
        run: python3 -m unittest discover -s tests -p 'test_verify_gitlinks.py' -v
      - name: Verify current tracked gitlinks and optional lock metadata
        run: python3 scripts/verify_gitlinks.py
      - name: Negative mutation must catch missing gitlinks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/verify_gitlinks.py")
          src = path.read_text()
          original = "    if declared_paths != indexed_paths:"
          assert src.count(original) == 1, "expected a single exact gitlink-set comparison"
          path.write_text(src.replace(original, "    if False:", 1))
          PY
          trap 'git checkout -- scripts/verify_gitlinks.py' EXIT
          if python3 -m unittest discover -s tests -p 'test_verify_gitlinks.py' -v -k test_rejects_untracked_declaration > "${RUNNER_TEMP}/gitlink-mutant.log" 2>&1; then
            echo "Gitlink-drift mutation unexpectedly passed" >&2
            exit 1
          fi
          grep -F 'FAILED (failures=1)' "${RUNNER_TEMP}/gitlink-mutant.log"
          grep -F 'test_rejects_untracked_declaration' "${RUNNER_TEMP}/gitlink-mutant.log"
          git checkout -- scripts/verify_gitlinks.py
          trap - EXIT
          if test -n "$(git status --porcelain)"; then
            echo "Mutation test left source worktree dirty" >&2
            git status --short >&2
            exit 1
          fi
      - name: Materialize only authorized public pinned submodules
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git submodule sync
          git -c protocol.file.allow=never submodule update --init --jobs=2
          python3 scripts/verify_gitlinks.py --materialized
          test -z "$(git status --porcelain)"
      - name: Install pinned Rust toolchain for public service submodules
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Build and test the exact pinned API and web revisions
        shell: bash
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          set -euo pipefail
          cargo test --locked --all-targets --manifest-path apps/gha-indie-worker-api-server.rs/Cargo.toml
          cargo test --locked --all-targets --manifest-path apps/gha-indie-worker-web-server.rs/Cargo.toml
          cargo build --locked --manifest-path apps/gha-indie-worker-web-server.rs/Cargo.toml
      - name: Exercise pinned web server readiness and route contracts
        shell: bash
        env:
          GHA_INDIE_WORKER_WEB_BIND: '127.0.0.1:18181'
        run: |
          set -euo pipefail
          apps/gha-indie-worker-web-server.rs/target/debug/gha-indie-worker-web-server &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail --max-time 1 http://127.0.0.1:18181/readyz > "${RUNNER_TEMP}/ready.json"; then
              break
            fi
            kill -0 "$server_pid"
            sleep 0.1
          done
          grep -F '"ok":true' "${RUNNER_TEMP}/ready.json"
          # The historical pinned web SHA serves /readyz only. Any new pin
          # must implement the hardened /healthz contract with a JSON 200.
          pinned_web="$(git -C apps/gha-indie-worker-web-server.rs rev-parse HEAD)"
          health_status="$(curl --silent --show-error --output "${RUNNER_TEMP}/health.json" --write-out '%{http_code}' --max-time 2 http://127.0.0.1:18181/healthz)"
          if test "$pinned_web" = "855e7f1c26eeded00533afed4b443b9bafe06ead"; then
            test "$health_status" = "404"
          else
            test "$health_status" = "200"
            grep -F '"ok":true' "${RUNNER_TEMP}/health.json"
          fi
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18181/ | grep -F 'GHA Indie Worker'
          test "$(curl --silent --output "${RUNNER_TEMP}/missing.txt" --write-out '%{http_code}' --max-time 2 http://127.0.0.1:18181/not-found)" = "404"
          grep -F 'not found' "${RUNNER_TEMP}/missing.txt"
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          python3 scripts/verify_gitlinks.py --materialized
          test -z "$(git status --porcelain)"
