name: oreslang-pr116-keyword-validation

on:
  pull_request:
    paths:
      - '_ci/oreslang-pr116/**'
      - '.github/workflows/oreslang-pr116-keyword-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify exact PR116 source mirror
        shell: bash
        run: |
          set -Eeuo pipefail
          cd _ci/oreslang-pr116/source
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "::error file=$path::blob mismatch expected=$expected actual=$actual"
              exit 1
            }
          done < ../SOURCE_BLOBS.sha
          test "$(wc -l < ../SOURCE_BLOBS.sha)" -eq 66
      - name: Verify exact PR116 base mirror
        shell: bash
        run: |
          set -Eeuo pipefail
          cd _ci/oreslang-pr116/base-source
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "::error file=$path::base blob mismatch expected=$expected actual=$actual"
              exit 1
            }
          done < ../BASE_BLOBS.sha
          test "$(wc -l < ../BASE_BLOBS.sha)" -eq 66
      - name: Run focused parser keyword tests
        working-directory: _ci/oreslang-pr116/source
        run: mvn -B -ntp -Dtest=ParserTest,RoutineAndLoopTest test
      - name: Run verification excluding known baseline actor-capability failures
        working-directory: _ci/oreslang-pr116/source
        run: mvn -B -ntp -Dtest='*,!ActorCapabilityIsolationTest' verify
      - name: Prove actor-capability failures predate PR116
        shell: bash
        run: |
          set -Eeuo pipefail
          for tree in source base-source; do
            set +e
            (cd "_ci/oreslang-pr116/$tree" && mvn -B -ntp -Dtest=ActorCapabilityIsolationTest test) >"/tmp/$tree-actorcap.log" 2>&1
            status=$?
            set -e
            cat "/tmp/$tree-actorcap.log"
            test "$status" -ne 0
            grep -Eq 'Tests run: 13, Failures: 10, Errors: 0' "/tmp/$tree-actorcap.log"
          done
