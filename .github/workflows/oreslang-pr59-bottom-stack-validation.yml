name: oreslang-pr59-bottom-stack-validation

on:
  pull_request:
    paths:
      - '_ci/oreslang-pr59/**'
      - '.github/workflows/oreslang-pr59-bottom-stack-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout exact Oreslang PR59 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ores-truffle-oreslang/oreslang-source.java
          ref: d84ade3f094174911eef27dd36ab81d179298431
          path: _ci/oreslang-pr59/source
      - name: Verify exact source head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C _ci/oreslang-pr59/source rev-parse HEAD)" = "d84ade3f094174911eef27dd36ab81d179298431"
          java --version
          mvn --version
      - name: Run focused await/actor tests
        working-directory: _ci/oreslang-pr59/source
        run: mvn -B -ntp -Dtest=AwaitSupportTest,ActorRuntimeTest,LanguageHardeningTest test
      - name: Run full Maven verification
        working-directory: _ci/oreslang-pr59/source
        run: mvn -B -ntp verify
