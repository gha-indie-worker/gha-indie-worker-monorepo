name: oreslang-pr86-gc-validation

on:
  pull_request:
    paths:
      - '_ci/oreslang-pr86/**'
      - '.github/workflows/oreslang-pr86-gc-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select preinstalled JDK 21
        shell: bash
        run: |
          set -Eeuo pipefail
          JAVA21_BIN="$(find /usr/lib/jvm /opt/hostedtoolcache -type f -path '*/bin/javac' 2>/dev/null | grep -E '(/21([^0-9]|$)|jdk-21|21\.)' | head -n 1)"
          test -n "$JAVA21_BIN"
          JAVA_HOME_CANDIDATE="$(dirname "$(dirname "$JAVA21_BIN")")"
          echo "JAVA_HOME=$JAVA_HOME_CANDIDATE" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_CANDIDATE/bin" >> "$GITHUB_PATH"
      - name: Checkout exact Oreslang PR86 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ores-truffle-oreslang/oreslang-source.java
          ref: 960f5c6ab36b6f713bfa60ad5095033ba9764410
          path: _ci/oreslang-pr86/source
      - name: Verify exact source head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C _ci/oreslang-pr86/source rev-parse HEAD)" = "960f5c6ab36b6f713bfa60ad5095033ba9764410"
          java --version
          mvn --version
      - name: Run focused GC hardening tests
        working-directory: _ci/oreslang-pr86/source
        run: mvn -B -ntp -Dtest=RuntimeGarbageCollectorTest,GarbageCollectionLanguageTest test
      - name: Run full Maven verification
        working-directory: _ci/oreslang-pr86/source
        run: mvn -B -ntp verify
