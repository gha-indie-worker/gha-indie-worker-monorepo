name: oreslang-pr86-gc-validation

on:
  pull_request:
    paths:
      - '_ci/oreslang-pr86/**'
      - '.github/workflows/oreslang-pr86-gc-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify exact PR86 source mirror
        shell: bash
        run: |
          set -Eeuo pipefail
          cd _ci/oreslang-pr86/source
          while read -r expected path; do
            test -n "$expected"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "::error file=$path::blob mismatch expected=$expected actual=$actual"
              exit 1
            }
          done < ../SOURCE_BLOBS.sha
          test "$(wc -l < ../SOURCE_BLOBS.sha)" -eq 55
          java --version
          mvn --version
      - name: Upload public PR86 baseline snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oreslang-pr86-baseline
          path: _ci/oreslang-pr86/source
          if-no-files-found: error
          retention-days: 1
      - name: Probe actor.gc diagnostic
        working-directory: _ci/oreslang-pr86/source
        shell: bash
        run: |
          set -Eeuo pipefail
          mvn -B -ntp -q -DskipTests test-compile dependency:build-classpath -Dmdep.outputFile=/tmp/ores-cp
          cat >/tmp/ActorGcProbe.java <<'JAVA'
          import dev.oreslang.OresLanguage;
          import org.graalvm.polyglot.Context;
          import org.graalvm.polyglot.PolyglotException;
          import org.graalvm.polyglot.Source;
          public final class ActorGcProbe {
            public static void main(String[] args) throws Exception {
              Source source = Source.newBuilder(OresLanguage.ID,
                  "pub fnc main() => void { actor.gc(); return; }",
                  "actor-gc-probe.ores").mimeType(OresLanguage.MIME_TYPE).build();
              try (Context context = Context.newBuilder(OresLanguage.ID).allowAllAccess(false).build()) {
                context.eval(source);
                System.out.println("PROBE_NO_ERROR");
              } catch (PolyglotException e) {
                System.out.println("PROBE_MESSAGE=" + e.getMessage());
                System.out.println("PROBE_GUEST=" + e.isGuestException());
                System.out.println("PROBE_HOST=" + e.isHostException());
                System.out.println("PROBE_INTERNAL=" + e.isInternalError());
              }
            }
          }
          JAVA
          CP="target/classes:target/test-classes:$(cat /tmp/ores-cp)"
          javac -cp "$CP" /tmp/ActorGcProbe.java
          java -cp "$CP:/tmp" ActorGcProbe
      - name: Stage Maven toolchain for private sandbox
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf _ci/oreslang-pr86/toolchain
          mkdir -p _ci/oreslang-pr86/toolchain
          cp -a /usr/share/apache-maven-3.9.16 _ci/oreslang-pr86/toolchain/apache-maven
          cp -a "$HOME/.m2" _ci/oreslang-pr86/toolchain/m2
      - name: Upload Maven toolchain for private sandbox
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oreslang-maven-toolchain
          path: _ci/oreslang-pr86/toolchain
          if-no-files-found: error
          retention-days: 1
      - name: Run focused GC hardening tests
        working-directory: _ci/oreslang-pr86/source
        run: mvn -B -ntp -Dtest=RuntimeGarbageCollectorTest,GarbageCollectionLanguageTest test
      - name: Run full Maven verification
        working-directory: _ci/oreslang-pr86/source
        run: mvn -B -ntp verify
