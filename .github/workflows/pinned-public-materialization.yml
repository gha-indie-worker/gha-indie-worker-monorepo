name: Pinned public Gitlink materialization and Rust tests

on:
  pull_request:
    paths:
      - .gitmodules
      - .zpkg.toml
      - .zpkg.lock
      - apps/**
      - scripts/materialize_pinned_public_services.sh
      - .github/workflows/pinned-public-materialization.yml

permissions:
  contents: read

jobs:
  public-source-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prove checked out head and clean source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$EXPECTED_HEAD"
          echo "EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Materialize only pinned public API and web Gitlinks
        shell: bash
        run: bash scripts/materialize_pinned_public_services.sh
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - name: Compile and test the exact pinned public services
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/gha-indie-worker-monorepo-target
        run: |
          set -euo pipefail
          for path in apps/gha-indie-worker-api-server.rs apps/gha-indie-worker-web-server.rs; do
            echo "PINNED_SERVICE=$path"
            echo "PINNED_COMMIT=$(git -C "$path" rev-parse HEAD)"
            if test -f "$path/Cargo.lock"; then
              cargo test --locked --all-targets --manifest-path "$path/Cargo.toml"
            else
              echo "::warning title=Unpinned Rust dependencies::$path has no committed Cargo.lock; this build tests the pinned source commit but is NOT a frozen dependency graph"
              cargo test --all-targets --manifest-path "$path/Cargo.toml"
            fi
          done
      - name: Classify Zed materialization evidence correctly
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^\[\[git-submodule\]\]' .zpkg.lock; then
            echo "UNVERIFIED_ZED_MATERIALIZATION: no package archive receipts are committed"
          else
            echo "ZED_LOCK_METADATA_PRESENT: this job does not verify tarball bytes or install a Zed toolchain"
          fi
          echo "PUBLIC_SOURCE_GITLINK_TESTS: complete (not cross-org or private source)"
