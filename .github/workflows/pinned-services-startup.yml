name: Pinned public services startup smoke

on:
  pull_request:
    paths:
      - scripts/smoke_pinned_services.py
      - scripts/materialize_pinned_public_services.sh
      - .github/workflows/pinned-services-startup.yml
      - .gitmodules
      - apps/**

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/gha-pinned-startup-target
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout immutable PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head and tree identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$EXPECTED_HEAD"
          echo "EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Compile source-owned startup smoke without side effects
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -c 'from pathlib import Path; f=Path("scripts/smoke_pinned_services.py"); compile(f.read_text(), str(f), "exec")'
      - name: Materialize two exact public service Gitlinks
        run: bash scripts/materialize_pinned_public_services.sh
      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'
      - name: Build pinned API and web executables with locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin gha-indie-worker-api-server --manifest-path apps/gha-indie-worker-api-server.rs/Cargo.toml
          cargo build --locked --bin gha-indie-worker-web-server --manifest-path apps/gha-indie-worker-web-server.rs/Cargo.toml
      - name: Exercise real startup, HTTP routes, bind conflicts and shutdown
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/smoke_pinned_services.py
          test -z "$(git status --porcelain --ignore-submodules=untracked)"
      - name: State evidence scope
        shell: bash
        run: |
          echo "PASS: pinned public-source binaries and localhost startup smoke"
          echo "NOT_EXECUTED: Zed archive verification, ores-compose deployment, hardened web #38 until merged"
